name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::122015480137:role/GitHubActionsTerraformRole
          aws-region: eu-north-1

      - name: Create temporary SSH public key
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -f ~/.ssh/terraform-devops -N ""

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false
        env:
          TF_VAR_aws_region: eu-north-1
          TF_VAR_project_name: terraform-devops
          TF_VAR_environment: dev
          TF_VAR_vpc_cidr: 10.0.0.0/16
          TF_VAR_public_subnet_cidr: 10.0.1.0/24
          TF_VAR_instance_type: t3.micro
          TF_VAR_ssh_public_key_path: /home/runner/.ssh/terraform-devops.pub